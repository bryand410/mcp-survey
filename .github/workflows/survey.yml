name: survey

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de serveurs à scanner"
        required: false
        default: "520"
      rebuild:
        description: "Reconstruire le catalogue depuis le registre npm"
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "survey/**"
      - "data/catalog.json"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mcp-scrutiny
        run: pip install "git+https://github.com/bryand410/mcp-scrutiny@main"

      - name: Scanner version
        run: mcp-scrutiny --version

      - name: Build catalogue
        if: github.event.inputs.rebuild == 'true'
        run: python survey/catalog.py

      - name: Scan
        env:
          LIMIT: ${{ github.event.inputs.limit || '520' }}
          WORKERS: "8"
          PROBE_TIMEOUT: "40"
        run: |
          rm -rf results work
          python survey/scan.py

      - name: Aggregate
        run: python survey/aggregate.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-results
          path: |
            data/run.json
            data/summary.json
            data/catalog.json
            data/tools.json
            results/

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/run.json data/summary.json data/catalog.json data/tools.json results/ || true
          git commit -m "data: scan results" || echo "nothing to commit"
          # Un run concurrent peut avoir poussé pendant le scan. Sans ce rebase,
          # le push est rejeté et les données restent dans l'artefact seulement.
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
